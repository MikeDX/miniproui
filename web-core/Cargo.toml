[package]
name = "minipro-web"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebAssembly session for the Chromium WebUSB build"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc = "3"
minipro-core = { path = "../third_party/minipro-rs/crates/minipro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
wasm-bindgen = "=0.2.104"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
