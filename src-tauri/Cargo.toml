[package]
name = "miniproui"
version = "0.1.0"
description = "Cross-platform UI for XGecu chip programmers"
authors = ["miniproui contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"

[lib]
name = "miniproui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
minipro-core = { path = "../third_party/minipro-rs/crates/minipro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
